<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stratus AI — QA Harness</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f3f4;
      color: #202124;
    }
    .wrap { display: flex; gap: 16px; align-items: flex-start; padding: 16px; }
    .rail { width: 330px; flex: 0 0 330px; }
    .stage { flex: 1; min-width: 0; }
    .card { background: #fff; border: 1px solid #dadce0; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .card h2 { margin: 0 0 4px; font-size: 13px; letter-spacing: .02em; text-transform: uppercase; color: #5f6368; }
    .hint { font-size: 12px; color: #5f6368; margin: 0 0 10px; line-height: 1.45; }
    button.scenario {
      display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 9px 11px;
      border: 1px solid #dadce0; border-radius: 8px; background: #fff; cursor: pointer;
      font-size: 13px; line-height: 1.35;
    }
    button.scenario:hover { background: #f8f9fa; border-color: #1a73e8; }
    button.scenario[data-active="true"] { background: #e8f0fe; border-color: #1a73e8; }
    button.scenario .bug { display: block; font-size: 11px; color: #d93025; font-weight: 600; }
    button.scenario .ok { display: block; font-size: 11px; color: #188038; font-weight: 600; }
    .panel {
      background: #fff; border: 1px solid #dadce0; border-radius: 10px;
      width: 420px; max-width: 100%; padding: 12px;
    }
    .panelhead {
      background: #b3401f; color: #fff; border-radius: 8px; padding: 10px 12px;
      font-weight: 700; font-size: 14px; margin-bottom: 12px;
    }
    .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; white-space: pre-wrap; }
    .log div { padding: 3px 0; border-bottom: 1px solid #f1f3f4; }
    .assert-pass { color: #188038; }
    .assert-fail { color: #d93025; font-weight: 700; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
