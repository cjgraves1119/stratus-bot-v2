name = "stratus-tdsynnex-pricing"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
# TD Synnex API base URL
TDSYNNEX_API_BASE = "https://ws.us.tdsynnex.com/webservice/ltd/api"
# Rate limit: requests per second (conservative to avoid throttling)
RATE_LIMIT_PER_SEC = 2
# Qualifier for TD Synnex API
QUALIFIER = "MG"

# TD Synnex credentials stored as secret:
#   wrangler secret put TDSYNNEX_AUTH_TOKEN
#   Value: <set via `wrangler secret put TDSYNNEX_AUTH_TOKEN` — never commit the literal>

# Shared pricing KV — same namespace as bot workers so they can read cost data
[[kv_namespaces]]
binding = "PRICES_KV"
id = "af24db17eaa644fe9456e2ae74379766"

# D1 analytics for logging refresh history
[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "stratus-bot-analytics"
database_id = "d4c3c112-e36b-4484-ac15-cbd848fa77fb"

# Daily cron at 5:00 AM CT (11:00 UTC) — runs after Zoho price cron
[triggers]
crons = ["0 11 * * *"]
