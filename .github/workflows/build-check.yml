name: Source Build Checks

# Pre-merge build validation. Catches syntax that `node -c` tolerates but
# Cloudflare's wrangler/esbuild rejects (e.g. inline backticks inside a
# template-literal-delimited prompt string — the exact failure that broke
# the 2026-04-25 deploy after PR #2 + PR #3 merged).
#
# Triggers:
#   - pull_request to main → block PR check until all three workers build
#   - push to main → defense in depth before any later manual deployment
#
# No CLOUDFLARE_API_TOKEN required: `wrangler deploy --dry-run --outdir`
# bundles to disk without uploading.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-secret-scan:
    name: Built-in secret-pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'

      - name: Scan every tracked and unignored candidate without printing values
        run: node scripts/scan-secrets.mjs

  worker-tests:
    name: Complete maintained Worker suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'

      - name: Enumerate and run all non-live Worker tests with a scrubbed environment
        run: node scripts/run-maintained-worker-tests.mjs

  extension-check:
    name: Extension tests + reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'

      - name: Set up exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          test "$(pnpm --version)" = "11.19.0"

      - name: Install from the sole extension lockfile
        working-directory: chrome-extension
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Enumerate and run the complete extension suite
        working-directory: chrome-extension
        run: pnpm run test:all

      - name: Build production twice and compare every byte
        working-directory: chrome-extension
        run: |
          pnpm run build:prod
          cp -a dist /tmp/stratus-extension-prod-first
          pnpm run build:prod
          diff -qr /tmp/stratus-extension-prod-first dist
          node -e "const m=require('./dist/manifest.json'); if(m.name!=='Stratus AI'||!m.update_url) process.exit(1)"
          test -z "$(find dist -type f -name '*.map' -print)"

      - name: Build and validate the non-releasing snapshot target
        working-directory: chrome-extension
        run: |
          pnpm run build:snapshot-dev
          node -e "const m=require('./dist/manifest.json'); if(m.name!=='Stratus AI (DEV)'||Object.hasOwn(m,'update_url')) process.exit(1)"

  build-check:
    name: Wrangler dry-run (${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [worker, worker-gchat, worker-gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'

      - name: Require a reproducible dependency lock for ${{ matrix.worker }}
        run: |
          test -f ${{ matrix.worker }}/package-lock.json || {
            echo "::error::${{ matrix.worker }}/package-lock.json is required"
            exit 1
          }

      - name: Install ${{ matrix.worker }} from its lockfile
        working-directory: ${{ matrix.worker }}
        run: npm ci --include=dev --ignore-scripts

      - name: Wrangler deploy --dry-run (${{ matrix.worker }})
        working-directory: ${{ matrix.worker }}
        run: npx --no-install wrangler deploy --dry-run --outdir /tmp/dry-run-${{ matrix.worker }}

      - name: Confirm bundle was produced
        run: |
          ls -la /tmp/dry-run-${{ matrix.worker }}/
          test -s /tmp/dry-run-${{ matrix.worker }}/index.js && echo "✓ ${{ matrix.worker }} built successfully" || (echo "✗ ${{ matrix.worker }} build produced no output" && exit 1)
