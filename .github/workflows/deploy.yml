name: Deploy Stratus Workers (manual exact commit)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character reviewed commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to request the protected-environment approval
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-stratus-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy all coupled Workers from exact source
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
    steps:
      - name: Check out exact reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact source and explicit confirmation
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::source_sha must be a full lowercase 40-character SHA"
            exit 1
          }
          test "$CONFIRMATION" = "DEPLOY"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA" || {
            echo "::error::production Worker deployment must use the current protected main tip"
            exit 1
          }
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'

      - name: Install Webex Worker dependencies from lockfile
        working-directory: worker
        run: npm ci --include=dev --ignore-scripts

      - name: Install Google Chat Worker dependencies from lockfile
        working-directory: worker-gchat
        run: npm ci --include=dev --ignore-scripts

      - name: Require a Gateway lockfile before deployment
        run: |
          test -f worker-gateway/package-lock.json || {
            echo "::error::worker-gateway/package-lock.json is required for a reproducible deployment"
            exit 1
          }

      - name: Install Gateway dependencies from lockfile
        working-directory: worker-gateway
        run: npm ci --include=dev --ignore-scripts

      - name: Preflight all coupled Worker bundles before any deployment
        env:
          PREFLIGHT_ROOT: ${{ runner.temp }}/stratus-worker-preflight
        run: |
          set -eu
          mkdir -p "$PREFLIGHT_ROOT"
          for component in worker worker-gchat worker-gateway; do
            output="$PREFLIGHT_ROOT/$component"
            mkdir -p "$output"
            (
              cd "$component"
              npx --no-install wrangler deploy --dry-run --outdir "$output"
            )
            test -n "$(find "$output" -type f -print -quit)" || {
              echo "::error::$component dry-run emitted no bundle"
              exit 1
            }
          done

      - name: Deploy Webex Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy

      - name: Deploy Google Chat Worker
        working-directory: worker-gchat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy

      - name: Deploy Gateway Worker
        working-directory: worker-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy

      - name: Record command-level result
        run: |
          echo "Deployment commands completed for ${{ inputs.source_sha }}."
          echo "This does not claim live functional or browser verification."
