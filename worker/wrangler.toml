# stratus-ai-bot (Webex bot)
#
# ⚠️ DEPLOY WITH AN EXPLICIT ENVIRONMENT — never a bare `wrangler deploy`:
#     wrangler deploy -e personal     # chrisg-ec1  (dev / test)
#     wrangler deploy -e corp         # corp it-262 (production)
# Top-level intentionally has NO name/account_id/bindings, so a flag-less deploy
# fails loudly instead of shipping a binding-less worker to the wrong account.
#
# Wrangler named environments do NOT inherit vars or bindings. When you add a NEW
# binding or var, add it to BOTH [env.personal] AND [env.corp] below.
main = "src/index.js"
compatibility_date = "2024-01-01"

# ════════════════════════════ PERSONAL — chrisg-ec1 (dev/test) ════════════════════════════
[env.personal]
name = "stratus-ai-bot"
account_id = "ec1888c5a0b51dc3eebf6bae13a3922b"

[env.personal.vars]
# Product_info waterfall feature flag (plain var, not a secret, to avoid trailing-newline issues).
USE_PRODUCT_INFO_WATERFALL = "true"
# Anthropic CF AI Gateway URL (account-specific).
ANTHROPIC_GATEWAY_URL = "https://gateway.ai.cloudflare.com/v1/ec1888c5a0b51dc3eebf6bae13a3922b/stratus-ai-bot/anthropic/v1/messages"
# Secrets (set via `wrangler secret put <NAME> --env personal`): WEBEX_BOT_TOKEN, ANTHROPIC_API_KEY.
# CF_QUOTE_V3_ENABLED is a per-deploy SECRET (set "true" on personal; leave UNSET on corp).

[[env.personal.d1_databases]]
binding = "ANALYTICS_DB"
database_name = "stratus-bot-analytics"
database_id = "d4c3c112-e36b-4484-ac15-cbd848fa77fb"
migrations_dir = "../migrations"

[[env.personal.kv_namespaces]]
binding = "CONVERSATION_KV"
id = "360fbb8a75bf400e87cb96893a811a56"

[[env.personal.kv_namespaces]]
binding = "PRICES_KV"
id = "af24db17eaa644fe9456e2ae74379766"

[[env.personal.analytics_engine_datasets]]
binding = "BOT_METRICS"
dataset = "stratus_bot_metrics"

[[env.personal.r2_buckets]]
binding = "BOT_STORAGE"
bucket_name = "stratus-bot-storage"

[env.personal.ai]
binding = "AI"

# ════════════════════════════ CORP — it-262 (production) ════════════════════════════
# Fill every <CORP_*> placeholder with the corporate account's real values, then
# deploy with `wrangler deploy -e corp`. Resource IDs are account-scoped — create
# them in the corp account first (see corp-deploy/README.md).
[env.corp]
name = "stratus-ai-bot"
account_id = "<CORP_ACCOUNT_ID>"

[env.corp.vars]
USE_PRODUCT_INFO_WATERFALL = "true"
ANTHROPIC_GATEWAY_URL = "https://gateway.ai.cloudflare.com/v1/<CORP_ACCOUNT_ID>/<CORP_GATEWAY_NAME>/anthropic/v1/messages"
# Secrets (--env corp): WEBEX_BOT_TOKEN (corp bot), ANTHROPIC_API_KEY. Do NOT set CF_QUOTE_V3_ENABLED.

[[env.corp.d1_databases]]
binding = "ANALYTICS_DB"
database_name = "stratus-bot-analytics"
database_id = "<CORP_D1_ID>"
migrations_dir = "../migrations"

[[env.corp.kv_namespaces]]
binding = "CONVERSATION_KV"
id = "<CORP_KV_WEBEX_ID>"

[[env.corp.kv_namespaces]]
binding = "PRICES_KV"
id = "<CORP_KV_SHARED_ID>"

[[env.corp.analytics_engine_datasets]]
binding = "BOT_METRICS"
dataset = "stratus_bot_metrics"

[[env.corp.r2_buckets]]
binding = "BOT_STORAGE"
bucket_name = "stratus-bot-storage"

[env.corp.ai]
binding = "AI"
