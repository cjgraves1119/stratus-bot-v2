# stratus-ai-bot-gchat (Google Chat bot + Chrome-extension backend)
#
# ⚠️ DEPLOY WITH AN EXPLICIT ENVIRONMENT — never a bare `wrangler deploy`:
#     wrangler deploy -e personal     # chrisg-ec1  (dev / test)
#     wrangler deploy -e corp         # corp it-262 (production)
# Top-level intentionally has NO name/account_id/bindings, so a flag-less deploy
# fails loudly instead of shipping a binding-less worker to the wrong account.
#
# Wrangler named environments do NOT inherit vars or bindings. When you add a NEW
# binding or var, add it to BOTH [env.personal] AND [env.corp] below.
#
# Workers Paid plan ($5/mo) required: no wall-clock limit on ctx.waitUntil(),
# and Queues + Workflows below are Paid-only features.
main = "src/index.js"
compatibility_date = "2024-01-01"

# ════════════════════════════ PERSONAL — chrisg-ec1 (dev/test) ════════════════════════════
[env.personal]
name = "stratus-ai-bot-gchat"
account_id = "ec1888c5a0b51dc3eebf6bae13a3922b"

[env.personal.vars]
USE_DEEPSEEK_TIER_3 = "false"
USE_DEEPSEEK_ADVISORY = "false"
QUOTE_PO_WORKFLOW_ENABLED = "true"
BOT_ADDRESS_GUARD_ENABLED = "true"
SYSTEM_OWNER_ID = "2570562000141711002"
SYSTEM_OWNER_EMAIL = "chrisg@stratusinfosystems.com"
SYSTEM_OWNER_NAME = "Chris Graves"
PRICE_CRON_NOTIFY_EMAIL = "chrisg@stratusinfosystems.com"
ANTHROPIC_GATEWAY_URL = "https://gateway.ai.cloudflare.com/v1/ec1888c5a0b51dc3eebf6bae13a3922b/stratus-ai-bot/anthropic/v1/messages"
# Secrets (`wrangler secret put <NAME> --env personal`): ANTHROPIC_API_KEY, ZOHO_CLIENT_ID/SECRET/
# REFRESH_TOKEN, GOOGLE_CLIENT_ID/SECRET/REFRESH_TOKEN, GCP_SERVICE_ACCOUNT_KEY, GOOGLE_PROJECT_NUMBER,
# GMAIL_ADDON_API_KEY, GITHUB_PAT, GATEWAY_INTERNAL_SECRET (must match the gateway worker).
# CF_QUOTE_V3_ENABLED is a per-deploy SECRET — "true" on personal, UNSET on corp.

[[env.personal.kv_namespaces]]
binding = "CONVERSATION_KV"
id = "af24db17eaa644fe9456e2ae74379766"

[[env.personal.kv_namespaces]]
binding = "PRICES_KV"
id = "af24db17eaa644fe9456e2ae74379766"

[[env.personal.d1_databases]]
binding = "ANALYTICS_DB"
database_name = "stratus-bot-analytics"
database_id = "d4c3c112-e36b-4484-ac15-cbd848fa77fb"
migrations_dir = "../migrations"

[[env.personal.services]]
binding = "SELF"
service = "stratus-ai-bot-gchat"

[[env.personal.queues.producers]]
queue = "stratus-gchat-crm-queue"
binding = "CRM_QUEUE"

[[env.personal.queues.consumers]]
queue = "stratus-gchat-crm-queue"
max_batch_size = 1
max_retries = 3
max_batch_timeout = 30
retry_delay = 30
dead_letter_queue = "stratus-gchat-crm-dlq"

[env.personal.ai]
binding = "AI"

[env.personal.triggers]
crons = ["0 11 * * *"]

[[env.personal.workflows]]
name = "stratus-gchat-crm-workflow"
binding = "CRM_WORKFLOW"
class_name = "CrmWorkflow"

[[env.personal.workflows]]
name = "stratus-gchat-quote-po-workflow"
binding = "QUOTE_PO_WORKFLOW"
class_name = "QuotePoWorkflow"

[[env.personal.analytics_engine_datasets]]
binding = "BOT_METRICS"
dataset = "stratus_bot_metrics"

[[env.personal.r2_buckets]]
binding = "BOT_STORAGE"
bucket_name = "stratus-bot-storage"

# ════════════════════════════ CORP — it-262 (production) ════════════════════════════
# Fill every <CORP_*> placeholder with the corporate account's real values, then
# deploy with `wrangler deploy -e corp`. Create the account-scoped resources in the
# corp account first (see corp-deploy/README.md). Corp runs the EXTENSION, not the
# Google Chat bot — so the Google-Chat secrets (GCP_SERVICE_ACCOUNT_KEY,
# GOOGLE_PROJECT_NUMBER) and JWT_VERIFY_ENFORCE are NOT needed; Gmail OAuth is
# optional (only for the bot's draft/send-email tools).
[env.corp]
name = "stratus-ai-bot-gchat"
account_id = "<CORP_ACCOUNT_ID>"

[env.corp.vars]
USE_DEEPSEEK_TIER_3 = "false"
USE_DEEPSEEK_ADVISORY = "false"
QUOTE_PO_WORKFLOW_ENABLED = "true"
BOT_ADDRESS_GUARD_ENABLED = "true"
PRICE_CRON_READONLY = "true"
SYSTEM_OWNER_ID = "<CORP_ZOHO_USER_ID>"
SYSTEM_OWNER_EMAIL = "<corp-operator-email>"
SYSTEM_OWNER_NAME = "<Corp Operator>"
PRICE_CRON_NOTIFY_EMAIL = "<corp-ops-distro>"
ANTHROPIC_GATEWAY_URL = "https://gateway.ai.cloudflare.com/v1/<CORP_ACCOUNT_ID>/<CORP_GATEWAY_NAME>/anthropic/v1/messages"
# Secrets (--env corp): ANTHROPIC_API_KEY, ZOHO_CLIENT_ID/SECRET/REFRESH_TOKEN, GMAIL_ADDON_API_KEY,
# GATEWAY_INTERNAL_SECRET (match gateway), GITHUB_PAT (optional). Gmail OAuth (GOOGLE_*) only if the
# bot must draft/send email. Do NOT set CF_QUOTE_V3_ENABLED, GCP_SERVICE_ACCOUNT_KEY, GOOGLE_PROJECT_NUMBER.

[[env.corp.kv_namespaces]]
binding = "CONVERSATION_KV"
id = "<CORP_KV_SHARED_ID>"

[[env.corp.kv_namespaces]]
binding = "PRICES_KV"
id = "<CORP_KV_SHARED_ID>"

[[env.corp.d1_databases]]
binding = "ANALYTICS_DB"
database_name = "stratus-bot-analytics"
database_id = "<CORP_D1_ID>"
migrations_dir = "../migrations"

[[env.corp.services]]
binding = "SELF"
service = "stratus-ai-bot-gchat"

[[env.corp.queues.producers]]
queue = "stratus-gchat-crm-queue"
binding = "CRM_QUEUE"

[[env.corp.queues.consumers]]
queue = "stratus-gchat-crm-queue"
max_batch_size = 1
max_retries = 3
max_batch_timeout = 30
retry_delay = 30
dead_letter_queue = "stratus-gchat-crm-dlq"

[env.corp.ai]
binding = "AI"

[env.corp.triggers]
crons = ["0 11 * * *"]

[[env.corp.workflows]]
name = "stratus-gchat-crm-workflow"
binding = "CRM_WORKFLOW"
class_name = "CrmWorkflow"

[[env.corp.workflows]]
name = "stratus-gchat-quote-po-workflow"
binding = "QUOTE_PO_WORKFLOW"
class_name = "QuotePoWorkflow"

[[env.corp.analytics_engine_datasets]]
binding = "BOT_METRICS"
dataset = "stratus_bot_metrics"

[[env.corp.r2_buckets]]
binding = "BOT_STORAGE"
bucket_name = "stratus-bot-storage"
